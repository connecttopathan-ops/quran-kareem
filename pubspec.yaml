name: quran_kareem
description: Get Quran - A beautiful Quran app
publish_to: 'none'
version: 1.0.5+37

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  http: ^1.1.0
  path_provider: ^2.1.4
  provider: ^6.1.1
  audio_service: ^0.18.0
  just_audio: ^0.9.37
  just_audio_background: ^0.0.1-beta.12
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^4.0.0
  intl: ^0.19.0
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  android_alarm_manager_plus: ^4.0.0
  permission_handler: ^11.3.0
  flutter_timezone: ^4.1.1
  adhan: ^2.0.0
  in_app_review: ^2.0.9
  device_info_plus: ^10.0.0
  flutter_foreground_task: ^8.14.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C0C12"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/translations/
    - assets/audio/adhan_makkah.mp3
    - assets/audio/adhan_madinah.mp3
    - assets/audio/adhan_makkah_fajr.mp3
    - assets/books/
  fonts:
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
