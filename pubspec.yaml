name: quran_kareem
description: Get Quran - A beautiful Quran app
publish_to: 'none'
version: 1.1.0+66

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  http: ^1.1.0
  path_provider: ^2.1.4
  provider: ^6.1.1
  audio_service: ^0.18.0
  just_audio: ^0.9.37
  just_audio_background: ^0.0.1-beta.12
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^4.0.0
  # Left unpinned on purpose: flutter_localizations pins intl to one exact
  # version per Flutter release, and any caret constraint here will sooner or
  # later collide with it on an SDK upgrade.
  intl: any
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  permission_handler: ^11.3.0
  flutter_timezone: ^4.1.1
  adhan: ^2.0.0
  in_app_review: ^2.0.9
  url_launcher: ^6.3.0
  device_info_plus: ^10.0.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C0C12"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Runs `gen-l10n` from l10n.yaml on pub get and build, turning lib/l10n/*.arb
  # into the generated L class.
  generate: true
  assets:
    - assets/icon/
    - assets/translations/
    - assets/quran_text.json
    - assets/audio/adhan_makkah.mp3
    - assets/audio/adhan_madinah.mp3
    - assets/audio/adhan_makkah_fajr.mp3
    - assets/books/
    - assets/tafsir/en/
    - assets/tafsir/fr/
    - assets/tafsir/es/
    - assets/tafsir/it/
  fonts:
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
