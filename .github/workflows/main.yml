name: Build Quran App AAB

on:
  push:
    branches: [ main, claude/check-missing-items-4JdPM, claude/fix-ios-flutter-build-fHNRQ ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Download ur-roman translation (Maududi Roman Urdu from fawazahmed0)
        run: python3 scripts/download_ur_roman.py
      - name: Download all 46 bundled translations (alquran.cloud)
        run: python3 scripts/download_all_translations.py
      - name: Bundle hadith assets (Bukhari & Muslim — EN, AR, UR)
        run: |
          if [ -f assets/books/bukhari_index.json ] && [ -f assets/books/muslim_index.json ]; then
            echo "Hadith assets already present in repo — skipping download."
          else
            pip install requests && python3 scripts/bundle_hadiths.py
          fi
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/qurankareem-release.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=qurankareem-release.jks
          EOF
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quran-kareem-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: quran-kareem-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  build-ios:
    name: Build iOS IPA & Upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Download ur-roman translation (Maududi Roman Urdu from fawazahmed0)
        run: python3 scripts/download_ur_roman.py
      - name: Download all 46 bundled translations (alquran.cloud)
        run: python3 scripts/download_all_translations.py
      - name: Bundle hadith assets (Bukhari & Muslim — EN, AR, UR)
        run: |
          if [ -f assets/books/bukhari_index.json ] && [ -f assets/books/muslim_index.json ]; then
            echo "Hadith assets already present in repo — skipping download."
          else
            python3 -m venv /tmp/hadith-venv
            /tmp/hadith-venv/bin/pip install requests
            /tmp/hadith-venv/bin/python scripts/bundle_hadiths.py
          fi
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build iOS IPA
        run: flutter build ipa --release
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: quran-kareem-ios-release
          path: build/ios/ipa/*.ipa
          retention-days: 90
